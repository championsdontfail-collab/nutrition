<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Питание</title><style>body{font-family:system-ui;background:#101827;color:#f4f6fa;margin:0;padding:20px}main{max-width:520px;margin:auto}.card{background:#202d40;border-radius:18px;padding:20px;margin:14px 0}h1{font-size:28px}.bar{display:flex;height:22px;border-radius:12px;overflow:hidden;background:#384456}.bar span:nth-child(1){background:#60a5fa}.bar span:nth-child(2){background:#f59e0b}.bar span:nth-child(3){background:#34d399}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:14px}.muted{color:#acb8ca}input{width:80px;background:#101827;color:white;border:1px solid #64748b;border-radius:8px;padding:8px}label{display:block;margin:12px 0}</style></head><body><main><h1>Питание за день</h1><p class="muted">Введите суммарные белки, жиры и углеводы за день в граммах. Диаграмма обновляется автоматически.</p><section class="card"><h2>БЖУ</h2><div class="bar" id="bar"><span></span><span></span><span></span></div><p id="summary"></p><div class="legend"><span>🔵 Белки</span><span>🟠 Жиры</span><span>🟢 Углеводы</span></div></section><section class="card"><h2>Данные</h2><label>Белки, г <input id="p" type="number" min="0" value="0"></label><label>Жиры, г <input id="f" type="number" min="0" value="0"></label><label>Углеводы, г <input id="c" type="number" min="0" value="0"></label><p id="kcal"></p></section><p class="muted">Расчёт калорий по формуле 4/9/4. Данные сохраняются только на этом устройстве.</p></main><script>const ids=['p','f','c'];let saved={};try{saved=JSON.parse(localStorage.getItem('nutrition-bju')||'{}')}catch(e){}ids.forEach(id=>{if(saved[id]!=null)document.getElementById(id).value=saved[id];document.getElementById(id).addEventListener('input',render)});function render(){let a=ids.map(id=>Math.max(0,Number(document.getElementById(id).value)||0)),total=a.reduce((x,y)=>x+y,0),cal=a[0]*4+a[1]*9+a[2]*4;document.querySelectorAll('#bar span').forEach((el,i)=>el.style.width=(total?a[i]/total*100:0)+'%');document.getElementById('summary').textContent='Белки '+a[0]+' г · Жиры '+a[1]+' г · Углеводы '+a[2]+' г';document.getElementById('kcal').textContent='Калорийность: '+Math.round(cal)+' ккал';try{localStorage.setItem('nutrition-bju',JSON.stringify(Object.fromEntries(ids.map((id,i)=>[id,a[i]]))))}catch(e){}}render();</script></body></html>
